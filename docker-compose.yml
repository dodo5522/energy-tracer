services:
  db:
    container_name: energy-tracer-db
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init/db:/docker-entrypoint-initdb.d:ro
      - ./init/db/postgres.conf:/etc/postgresql/postgresql.conf:ro
    env_file:
      - ./backend/.env
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U postgres",
      ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: energy-tracer-be
    build:
      context: .
      dockerfile: ./docker/backend-dev/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./:/work
    working_dir: /work

  frontend:
    container_name: energy-tracer-fe
    build:
      context: .
      dockerfile: ./docker/frontend-dev/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./:/work
    working_dir: /work
    command: >
      bash -c "
        eval $(/usr/local/bin/mise activate bash) &&
        cd frontend &&
        pnpm install &&
        pnpm exec auth migrate --yes --config src/lib/auth/migration.server.ts &&
        pnpm dev --host 0.0.0.0
      "
